name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 python3 perl
          SHELLCHECK_VERSION=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          YQ_VERSION=v4.53.6
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Verify toolchain
        run: |
          missing=0
          for tool in bash jq sqlite3 yq python3 perl shellcheck node npx; do
            path=$(command -v "$tool" || true)
            printf '%-12s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || missing=1
          done
          shellcheck --version | grep '^version:'
          exit $missing

      - name: Run tests
        run: make test

      - name: Run checks
        if: ${{ !cancelled() }}
        run: make check
